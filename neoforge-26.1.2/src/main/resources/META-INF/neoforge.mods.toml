displayName="地球：生命科学 / Earth: Life Sciences"
description='''
地球系列的生命科学扩展：生物学（显微观察、微生物、工业发酵、遗传、育种、PCR、基因工程）与医学进阶层（解剖、生理、诊断、检验、抗生素、免疫、麻醉学、外科、内科、内分泌、精神、肿瘤、输液、放射医学）。
Life Sciences discipline expansion for the Earth series: biology (microscopy, microbiology, industrial fermentation, genetics, plant breeding, PCR, genetic engineering) and advanced medicine (anatomy, physiology, diagnostics, lab medicine, antibiotics, immunology, anesthesiology, surgery, internal medicine, endocrinology, psychiatry, oncology, IV therapy, radiology).
'''
